[project]
name = "golem-openrouter"
version = "0.1.0"
description = "OpenRouter provider extension for Golem"
readme = "README.md"
authors = [
    { name = "Nawaz Gafar" }
]
requires-python = ">=3.11"
dependencies = [
    "golem-agent-sdk>=0.1.3",
]

[project.scripts]
golem-openrouter = "golem_openrouter:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
